[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property_capture"
version = "0.1.0"
description = "Phone captures to dimensioned floor plans with damage assessment"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pycolmap>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
