# Phase 0 RGB-D baseline configuration. Labels refer to docs/requirements/assumptions.md.
seed: 0

depth:
  unit_scale_m: 0.001        # ASSUMPTION B-03 (mm); checked by pose_convention.depth_scale_grid
  min_m: 0.2
  max_m: 5.0
  confidence_min: 1          # PROPOSED B-04: drop confidence 0 only

pose_convention:
  pair_gap_frames: 15        # ~0.25-0.33 s apart at 45-60 Hz
  num_pairs: 24
  pixel_step: 4
  depth_scale_grid: [0.5, 0.8, 0.9, 0.95, 1.0, 1.05, 1.1, 1.25, 2.0]

gravity:
  imu_stride: 5
  max_spread_deg: 10.0

rgb:                           # calibration/rgb_alignment.py: depth vs RGB alignment and frame pairing (B-07, B-15)
  enabled: true
  frame_stride: 3
  samples: 24                  # low-motion frames checked, spread over the capture
  calm_percentile: 30          # frames in the lowest 30% of rotation and translation between neighbours
  work_scale: 2                # comparison at 2x depth resolution (512x384)
  confidence_min: 1
  edge_percentile: 96          # depth edges: strongest 4% of log-depth gradients...
  edge_min_log_jump: 0.05      # ...and at least a ~5% relative depth jump
  min_edge_pixels: 200
  max_shift_px: 3.0            # search range, depth pixels
  shift_step_px: 0.25
  aligned_max_shift_px: 0.5    # aligned if median shift <= 0.5 depth px (~0.13 deg)...
  quadrant_max_spread_px: 0.5  # ...and image quadrants agree (no scale/rotation error)
  max_correctable_shift_px: 2.0  # larger consistent offsets are treated as a calibration problem
  temporal_samples: 24
  temporal_motion_percentiles: [60, 90]  # moderate rotation: neighbours differ, little motion blur
  temporal_min_fraction: 0.5   # paired video frame should align best in at least half the frames
  preview_frames: 4

video:                         # modalities/video_sfm.py: video tier (RGB video only, no depth or poses)
  # first run (single_room): 3 fps, 1024 px, 4096 features, overlap 10, COLMAP default mapper
  # -> 18 of 93 frames registered in the largest of 4 models (reports/video_tier)
  target_fps: 6                # keep the sharpest frame of each 1/6 s window
  analysis_width: 480          # sharpness measured on a downscaled grey image
  min_sharpness_ratio: 0.5     # drop kept frames blurrier than half the median sharpness
  max_image_size: 1600         # longest side for feature extraction (CPU)
  camera_model: SIMPLE_RADIAL  # one shared camera, focal length estimated
  max_features: 8192
  # round 2 (6 fps, 1600 px, 8192 features, overlap 20, looser mapper): 36 of 170 frames,
  # 7 pieces of 18-36 frames; ATE 3.7 cm RMS (round 1: 1.1 cm)
  # round 3 (exhaustive matching): 43 of 170 in the largest of 7 pieces; 160 of 170 in some piece.
  # Breaks fall where the phone turns on the spot (38 deg/s, 175 deg per metre walked vs 50 elsewhere):
  # no parallax, so no 3D points to attach the next stretch to.
  matcher: sequential          # sequential | exhaustive (all pairs: joins pieces at revisits; O(n^2))
  sequential_overlap: 20       # match each frame with the next 20 (plus quadratic overlap)
  random_seed: 0
  pipeline:                    # COLMAP IncrementalPipelineOptions (defaults in brackets)
    structure_less_registration_fallback: false  # [false] place a frame from 2D matches when no 3D points are visible
  mapper:                      # COLMAP IncrementalMapperOptions (defaults in brackets)
    init_min_tri_angle: 4.0    # [16] degrees between the first two cameras of a model
    init_min_num_inliers: 50   # [100]
    abs_pose_min_num_inliers: 15     # [30] matches needed to add a camera
    abs_pose_min_inlier_ratio: 0.15  # [0.25]

openings:                      # rooms/openings.py: doors, windows and other openings from camera rays
  enabled: true
  frame_stride: 6
  pixel_step: 4
  confidence_min: 2
  cell_m: 0.02                 # elevation grid along the wall x height; also the width resolution
  wall_band_m: 0.05            # ray ends within this of the wall plane: wall evidence
  through_min_beyond_m: 0.10   # ray ends this far beyond the wall plane: seen through
  min_through: 2
  through_ratio: 2.0           # open cell: seen through >= 2x as often as seen as wall
  close_m: 0.06
  core_column_fraction: 0.5    # width from columns covering >= 50% of the opening's height
  min_width_m: 0.40
  min_height_m: 0.30
  min_edge_length_m: 0.50
  default_height_m: 2.6        # wall height searched when the room's ceiling is unknown
  jamb_extend_m: 0.30          # grid extends past edge ends: a doorway often ends an edge, its jamb is on the next
  passage_head_margin_m: 0.10  # floor-to-ceiling openings (head within this of the ceiling) are passages
  jamb_check_m: 0.10           # wall must be seen beside the opening on both sides...
  jamb_min_fraction: 0.3       # ...over >= 30% of the opening's height
  door_max_sill_m: 0.10
  door_min_head_m: 1.80
  window_min_sill_m: 0.30
  match_connection_m: 0.5      # a door this close to a room-to-room opening confirms it

drift:                         # registration/pose_graph.py (default) or registration/drift.py
  enabled: true
  method: pose_graph           # pose_graph | keyframe_to_map (superseded: lost to device poses, reports/drift)
  # pose graph: odometry edge sigma = base + drift rate x distance between keyframes (B-22)
  odom_sigma_base_m: 0.005
  odom_sigma_base_deg: 0.1
  loop_max_candidates: 200
  loop_submap_keyframes: 2     # keyframes on each side of the earlier keyframe form its local map
  loop_min_inlier_fraction: 0.5
  loop_max_rms_m: 0.02
  loop_sigma_m: 0.02
  loop_sigma_deg: 0.5
  loop_fb_max_deg: 0.5         # a->b and b->a registrations must undo each other within this
  loop_fb_max_m: 0.03
  loop_huber: 3.0              # robust weighting threshold (normalized residual)
  loop_max_chi: 5.0            # loops still this inconsistent after solving are removed
  graph_iterations: 10
  ablation: true               # also build the plan from raw poses in the same run (PDF drift gate)
  frame_stride: 3
  jump_threshold_m: 0.10       # odometry step that counts as a tracking jump (assumptions.md B-19)
  keyframe_translation_m: 0.30
  keyframe_rotation_deg: 15.0
  pixel_step: 4
  confidence_min: 2            # registration uses high-confidence depth only
  max_depth_m: 4.0
  edge_depth_jump_m: 0.05      # no normals across depth discontinuities
  max_incidence_deg: 75.0      # drop surfaces seen at grazing angles
  max_points_per_keyframe: 3000
  map_voxel_m: 0.05
  icp_iterations: 15
  icp_max_distance_m: 0.20     # correspondence gate, shrinks each iteration
  icp_min_distance_m: 0.05
  icp_huber_m: 0.02
  icp_damping: 1.0
  icp_min_inliers: 200
  icp_min_inlier_fraction: 0.3
  icp_min_eigen: 0.001         # smallest eigenvalue of the normalized normal matrix; lower = degenerate (corridor, single wall)
  # Accepted correction change per keyframe <= base + rate x distance walked since the matched map
  # region was first scanned (ASSUMPTION: odometry drift <= 2% of distance and 1 deg per metre).
  drift_base_m: 0.02
  drift_rate: 0.02
  drift_base_deg: 0.5
  drift_rate_deg_per_m: 1.0
  jump_allowance: 1.5          # x the size of a tracking jump between the matched map and this keyframe
  jump_allowance_deg: 5.0
  revisit_min_gap_s: 10.0      # revisit pairs for drift evidence: frames far apart in time seeing the same surfaces
  revisit_max_distance_m: 2.0  # loose candidate bounds; the overlap test decides
  revisit_max_angle_deg: 60.0
  revisit_min_overlap: 0.3     # fraction of one frame's depth landing in the other's view
  revisit_informative_max_m: 0.25  # pairs disagreeing more than this under every trajectory are uninformative
  revisit_max_candidates: 300
  revisit_max_pairs: 40
  validation_min_pairs: 10     # corrected poses are applied only if revisit pairs show they agree better

fusion:
  frame_stride: 3
  pixel_step: 2
  voxel_size_m: 0.02
  min_points_per_voxel: 2

planes:
  histogram_bin_m: 0.01
  peak_window_m: 0.05
  ransac_threshold_m: 0.015
  ransac_iterations: 300
  max_tilt_deg: 10.0
  floor_min_fraction: 0.02
  ceiling_min_fraction: 0.01
  floor_below_camera_m: 0.3
  ceiling_above_camera_m: 0.1

floorplan:
  grid_m: 0.02
  floor_inlier_m: 0.03
  wall_band_above_floor_m: 0.3
  wall_band_below_ceiling_m: 0.3
  wall_band_max_above_floor_m: 2.0
  wall_min_points: 2
  close_m: 0.10
  simplify_m: 0.05
  wall_support_m: 0.05
  observed_bin_m: 0.05
  min_observed_fraction: 0.5
  open_min_area_kept: 0.95    # sliver removal is rejected if the room region would lose more than 5% of its area
  polygon_method: wall_snap   # wall_snap | occupancy (Phase 0 baseline)
  shared_walls:               # rooms/shared_walls.py: pair the two faces of walls between rooms
    max_angle_deg: 5.0
    min_thickness_m: 0.03     # thinner gaps are outline noise, not a wall
    max_thickness_m: 0.40     # partition walls through thick masonry
    min_overlap_m: 0.30
    group_tolerance_m: 0.05   # face pairs further than this from their wall's thickness are outline jogs
    max_thickness_variation_m: 0.04  # thickness is measured only if the faces stay parallel within this
    align: true               # rotate both faces of each shared wall to one direction (rooms/wall_alignment.py)
    align_min_corner_deg: 20.0  # neighbouring edges closer to parallel than this: project the corner instead
    align_max_area_change: 0.02  # skip a wall if a room's area would change by more than 2%
    align_max_new_overlap_m2: 0.001
    align_trim_overlap_m2: 0.05     # a corner overlap this small between the wall's own two rooms is trimmed
  ceiling:                    # rooms/ceiling.py: when a room's ceiling height is measurable
    cell_m: 0.25              # one level per cell; cells, not points, count as independent evidence
    min_cells: 8              # >= 0.5 m2 of ceiling seen in the room
    min_floor_cells: 8        # else the floor level comes from all floor points
    max_flatness_iqr_m: 0.015 # per-cell ceiling levels must agree within the PDF tolerance
    max_standard_error_m: 0.005  # 3 x standard error within the 1.5 cm ceiling-height gate
    min_sigma_m: 0.002        # floor on the per-cell spread (depth noise), so a few identical cells do not claim 0 error
    min_height_m: 2.0         # plausible ceiling heights; lower is likely a furniture top
    max_height_m: 6.0
  segmentation:               # split into rooms at doorways (wall_snap only)
    enabled: true
    door_max_width_m: 1.0     # passages narrower than this separate rooms; wider openings stay open-plan
    barrier_thickness_m: 0.06 # detected wall segments drawn as barriers this thick
    min_seed_area_m2: 0.5     # free space left after shrinking must be at least this to seed a room
    min_room_area_m2: 2.0     # smaller regions join the neighbour they touch most
    visited_min_camera_fraction: 0.02
    min_opening_width_m: 0.4
    min_shared_wall_m: 0.5
    max_wall_thickness_m: 0.30 # rooms within this distance across a wall share it (both wall faces are detected)
  walls:
    cell_m: 0.04
    height_bin_m: 0.10
    tall_fraction: 0.5        # cell must have points in >= 50% of the wall band's height bins
    ransac_threshold_m: 0.03
    ransac_iterations: 300
    sample_radius_m: [0.2, 1.0]
    min_inliers: 15
    max_lines: 60
    max_gap_m: 0.25           # larger gaps split a line into segments (doors, windows)
    min_segment_m: 0.4
    min_segment_points: 10
    merge_angle_deg: 3.0
    merge_offset_m: 0.05
    snap_distance_m: 0.10
    extent_margin_m: 0.30
    min_run_m: 0.25
    adjacent_merge_angle_deg: 5.0   # neighbouring runs on near-parallel lines this close are one wall
    adjacent_merge_offset_m: 0.10
    free_simplify_m: 0.15           # outline stretches no wall explains are inferred; finer detail is false precision
    min_feature_width_m: 0.15       # outline protrusions narrower than this are sensing artifacts (strips seen through gaps)
    corner_min_angle_deg: 20.0
    corner_fill_radius_m: 0.6       # unexplained contour within this distance of a wall intersection is a hidden corner
    max_corner_shift_m: 0.5
    min_edge_m: 0.05
    collinear_m: 0.01

consistency:
  split_halves: true

checks:
  camera_height_range_m: [0.3, 2.2]   # handheld capture: plausible camera height above floor
